name: Build Custom Talos OS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile (standard | gpu | storage | proxmox)'
        required: false
        default: 'standard'
      extra_extensions:
        description: 'Extra OCI extension refs to bake in (space-separated)'
        required: false
        default: ''
      talos_version:
        description: 'Talos version override (e.g. v1.9.0)'
        required: false
        default: ''

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: itlusions/itl-talos-hardened-os
  TALOS_VERSION: v1.9.0
  PKGS_VERSION: release-1.9
  GVISOR_TAG: 20260427.0
  INTEL_UCODE_TAG: 20260227
  BUILD_CUSTOM_KERNEL: false

jobs:
  build-extensions:
    name: Build & Push Talos Extensions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push itl-branding extension
        uses: docker/build-push-action@v5
        with:
          context: extensions/itl-branding
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/itlusions/itl-talos-hardened-os-branding:latest
            ${{ env.REGISTRY }}/itlusions/itl-talos-hardened-os-branding:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push itl-security extension
        uses: docker/build-push-action@v5
        with:
          context: extensions/itl-security
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/itlusions/itl-talos-hardened-os-security:latest
            ${{ env.REGISTRY }}/itlusions/itl-talos-hardened-os-security:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-configs:
    name: Generate Talos Configurations
    runs-on: ubuntu-latest
    needs: [build-extensions]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Install talosctl
        run: |
          curl -Lo /usr/local/bin/talosctl \
            https://github.com/siderolabs/talos/releases/download/${{ env.TALOS_VERSION }}/talosctl-linux-amd64
          chmod +x /usr/local/bin/talosctl
          talosctl version --client
          echo "[OK] talosctl installed"
      
      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      
      - name: Generate base configurations
        run: |
          mkdir -p config/generated config/output
          
          # Generate control plane config
          talosctl gen config itl-cluster \
            https://api.itlusions.com:6443 \
            --output-types controlplane \
            --output config/generated/controlplane.yaml
          
          # Generate worker config
          talosctl gen config itl-cluster \
            https://api.itlusions.com:6443 \
            --output-types worker \
            --output config/generated/worker.yaml
          
          echo "[OK] Base configurations generated"
      
      - name: Apply branding patches
        run: |
          # Apply ITL branding configuration patches
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
            config/generated/controlplane.yaml \
            config/patches/branding-patch.yaml \
            > config/output/controlplane-branded.yaml
          
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
            config/generated/worker.yaml \
            config/patches/branding-patch.yaml \
            > config/output/worker-branded.yaml
          
          echo "[OK] Branding patches applied"
      
      - name: Apply security hardening patches
        run: |
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
            config/output/controlplane-branded.yaml \
            config/patches/security-hardening.yaml \
            > config/output/controlplane-hardened.yaml

          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
            config/output/worker-branded.yaml \
            config/patches/security-hardening.yaml \
            > config/output/worker-hardened.yaml

          echo "[OK] Security hardening patches applied"

      - name: Apply network hardening patch
        run: |
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
            config/output/controlplane-hardened.yaml \
            config/patches/network-hardening.yaml \
            > config/output/controlplane-network.yaml

          # Workers get the same network hardening minus etcd config
          cp config/output/worker-hardened.yaml config/output/worker-network.yaml

          echo "[OK] Network hardening patches applied"

      - name: Apply OIDC integration patch (control plane only)
        run: |
          yq eval-all 'select(fileIndex == 0) * select(fileIndex == 1)' \
            config/output/controlplane-network.yaml \
            config/patches/oidc-patch.yaml \
            > config/output/controlplane-final.yaml

          cp config/output/worker-network.yaml config/output/worker-final.yaml

          echo "[OK] OIDC integration patch applied"

      - name: Add custom extensions (optional — only needed for cluster-specific extras)
        run: |
          TAG=${{ github.ref_name }}
          # Fall back to 'latest' on workflow_dispatch (no tag)
          [[ -z "$TAG" || "$TAG" == refs/* ]] && TAG="latest"

          # NOTE: Core extensions (itl-branding, itl-security, gvisor, intel-ucode) are
          # baked directly into the ISO by the imager (build-iso job).
          # machine.install.extensions is only needed for ADDITIONAL extensions
          # that are NOT in the ISO — e.g. cluster-specific or optional ones.
          #
          # To add extras, uncomment and extend the yq commands below:
          #
          # yq eval ".machine.install.extensions += [
          #   {\"image\": \"ghcr.io/myorg/my-extra-ext:${TAG}\"}
          # ]" -i config/output/controlplane-final.yaml
          #
          # yq eval ".machine.install.extensions += [
          #   {\"image\": \"ghcr.io/myorg/my-extra-ext:${TAG}\"}
          # ]" -i config/output/worker-final.yaml

          echo "[OK] No additional extensions added (core set is baked into ISO)"

      - name: Generate Kyverno policies (from ITL.ControlPanel.PolicyBuilder)
        run: |
          echo "[*] Installing ITL PolicyBuilder..."
          pip install --quiet pyyaml
          pip install --quiet "git+https://github.com/itlivetech/ITL.ControlPanel.PolicyBuilder.git"

          echo "[*] Generating Kyverno security policies..."
          python scripts/generate-kyverno-patch.py \
            --profile security \
            --output config/output/kyverno-policies.yaml
          echo "[OK] Kyverno policies generated"

      
      - name: Validate configurations
        run: |
          # Validate generated configs
          talosctl validate --config config/output/controlplane-final.yaml --mode metal || echo "[!] Control plane validation warnings"
          talosctl validate --config config/output/worker-final.yaml --mode metal || echo "[!] Worker validation warnings"
          echo "[✓] Configuration validation complete"
      
      - name: Create configuration summary
        run: |
          cat > config/output/README.md << 'EOF'
          # Talos Configuration Files
          
          ## Files Included
          
          - **controlplane-final.yaml**: Configuration for Talos control plane nodes
          - **worker-final.yaml**: Configuration for Talos worker nodes
          
          ## Applied Patches
          
          1. **Branding Patch**: Adds ITL branding console banner and customizations
          2. **Security Hardening**: Applies security hardening configuration
          3. **Custom Extensions**: Includes branding, security, gVisor, and intel-ucode extensions
          
          ## Usage
          
          ```bash
          # Apply control plane config
          talosctl apply-config --nodes <control-plane-ip> --file controlplane-final.yaml
          
          # Apply worker config
          talosctl apply-config --nodes <worker-ip> --file worker-final.yaml
          ```
          
          ## Customization
          
          Before applying, ensure to:
          1. Update the cluster endpoint (currently: https://api.itlusions.com:6443)
          2. Customize network settings as needed
          3. Configure storage paths for your environment
          
          ## Support
          
          For configuration questions, see the Talos documentation:
          https://www.talos.dev/v1.9/
          EOF
          
          cat config/output/README.md
      
      - name: Upload configuration artifacts
        uses: actions/upload-artifact@v4
        with:
          name: talos-configs
          path: config/output/
          retention-days: 30

  build-iso:
    name: Build Bootable ISO
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: [build-extensions, generate-configs]
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set extension tags
        run: |
          TAG="${{ github.ref_name }}"
          # On workflow_dispatch (no tag) fall back to latest
          [[ -z "$TAG" || "$TAG" == refs/* ]] && TAG="latest"
          echo "EXT_TAG=$TAG" >> $GITHUB_ENV

      - name: Load device mapper (required by imager)
        run: |
          sudo modprobe dm-mod || true
          ls /dev/mapper/control && echo "[OK] /dev/mapper/control ready" || echo "[!] /dev/mapper/control not found"

      - name: Build ISO via Talos imager
        env:
          TALOS_VERSION: ${{ env.TALOS_VERSION }}
          ITL_BRANDING_TAG: ${{ env.EXT_TAG }}
          ITL_SECURITY_TAG: ${{ env.EXT_TAG }}
          PROFILE: ${{ github.event.inputs.profile || 'standard' }}
          EXTRA_EXTENSIONS: ${{ github.event.inputs.extra_extensions || '' }}
          EXTRACT_NETBOOT: "true"
        run: |
          chmod +x ./build-simple.sh
          ./build-simple.sh

      - name: Collect build output
        run: |
          PROFILE="${{ github.event.inputs.profile || 'standard' }}"
          mkdir -p build-output

          cp -v "itl-talos-${{ env.TALOS_VERSION }}.iso"        build-output/
          cp -v "itl-talos-${{ env.TALOS_VERSION }}.iso.sha256" build-output/
          cp -v "itl-talos-${{ env.TALOS_VERSION }}.iso.md5"    build-output/

          # Copy netboot assets if present
          NETBOOT_SRC="netboot-assets/${PROFILE}"
          if [ -d "$NETBOOT_SRC" ]; then
            mkdir -p "build-output/netboot/${PROFILE}"
            cp -v "$NETBOOT_SRC/vmlinuz"      "build-output/netboot/${PROFILE}/"
            cp -v "$NETBOOT_SRC/initramfs.xz" "build-output/netboot/${PROFILE}/"
            echo "[OK] Netboot assets collected for profile: ${PROFILE}"
          fi

          cat > "build-output/itl-talos-${{ env.TALOS_VERSION }}-info.txt" << EOF
          ITL Talos HardenedOS — Build Information
          Version   : ${{ env.TALOS_VERSION }}
          Profile   : ${PROFILE}
          Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')
          Commit    : ${{ github.sha }}
          Tag       : ${{ github.ref_name }}

          Extensions baked in (imager — airgap-ready):
            ghcr.io/itlusions/itl-talos-hardened-os-branding:${{ env.EXT_TAG }}
            ghcr.io/itlusions/itl-talos-hardened-os-security:${{ env.EXT_TAG }}
            ghcr.io/siderolabs/gvisor (pinned tag)
            ghcr.io/siderolabs/intel-ucode (pinned tag)
          ${{ github.event.inputs.extra_extensions && format('  Extra: {0}', github.event.inputs.extra_extensions) || '' }}

          NOTE: machine.install.extensions is not required for the above.
                Use it only for additional cluster-specific extensions.
          EOF

      - name: Download Talos configuration artifact
        uses: actions/download-artifact@v4
        with:
          name: talos-configs
          path: build-output/configs/

      - name: Include configs in build output
        run: |
          cp -v build-output/configs/controlplane-final.yaml build-output/ || echo "[!] controlplane-final.yaml not found in artifact"
          cp -v build-output/configs/worker-final.yaml build-output/ || echo "[!] worker-final.yaml not found in artifact"
          echo "[OK] Talos configs included in build output"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: bootable-iso
          path: build-output/
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build-output/itl-talos-${{ env.TALOS_VERSION }}.iso
            build-output/itl-talos-${{ env.TALOS_VERSION }}.iso.sha256
            build-output/itl-talos-${{ env.TALOS_VERSION }}.iso.md5
            build-output/itl-talos-${{ env.TALOS_VERSION }}-info.txt
            build-output/controlplane-final.yaml
            build-output/worker-final.yaml
          body: |
            # ITL Talos HardenedOS ${{ github.ref_name }}

            Security-hardened Talos OS with ITL extensions baked directly into the ISO.

            ## Extensions (pre-installed — airgap-ready)
            - `itl-talos-hardened-os-branding` — ITLusions console banners, MOTD
            - `itl-talos-hardened-os-security` — sysctl hardening, audit rules, modprobe policy
            - `siderolabs/gvisor` — gVisor sandbox runtime
            - `siderolabs/intel-ucode` — Intel microcode updates

            ## Files
            | File | Description |
            |------|-------------|
            | `itl-talos-${{ env.TALOS_VERSION }}.iso` | Bootable ISO (metal-amd64) |
            | `.sha256` / `.md5` | Checksums |
            | `controlplane-final.yaml` | Talos control plane machine config |
            | `worker-final.yaml` | Talos worker machine config |

            ## Quick Start
            ```bash
            # Verify checksum
            sha256sum -c itl-talos-${{ env.TALOS_VERSION }}.iso.sha256

            # Flash to USB (Linux/macOS)
            sudo dd if=itl-talos-${{ env.TALOS_VERSION }}.iso of=/dev/sdX bs=4M status=progress
            ```
            Then run `setup-cluster-baremetal.ps1` — no internet needed on nodes during install.

            ## MachineConfig Note
            `machine.install.extensions` is **not required** for the bundled extensions.
            Use it only for additional cluster-specific extensions.
          draft: false
          prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Lint YAML files
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint
          
          echo "[*] Linting Dockerfiles..."
          yamllint .github/workflows/*.yaml || true
          
          echo "[*] Linting configuration files..."
          yamllint config/patches/*.yaml || true
          
          echo "[✓] YAML linting complete"
      
      - name: Validate extension Dockerfiles
        run: |
          # Check if Dockerfiles exist and are valid
          if [ -f extensions/itl-branding/Dockerfile ]; then
            docker run --rm -i hadolint/hadolint < extensions/itl-branding/Dockerfile || true
          fi
          
          if [ -f extensions/itl-security/Dockerfile ]; then
            docker run --rm -i hadolint/hadolint < extensions/itl-security/Dockerfile || true
          fi
          
          echo "[✓] Dockerfile validation complete"
      
      - name: Validate Talos configurations
        run: |
          # Install talosctl
          curl -Lo /usr/local/bin/talosctl \
            https://github.com/siderolabs/talos/releases/download/${{ env.TALOS_VERSION }}/talosctl-linux-amd64
          chmod +x /usr/local/bin/talosctl
          
          # Validate config structure
          if [ -f config/patches/branding-patch.yaml ]; then
            talosctl validate --config config/patches/branding-patch.yaml --mode metal || echo "[!] Branding patch validation warnings"
          fi
          
          echo "[OK] Configuration validation complete"

  notify-status:
    name: Notify Build Status
    runs-on: ubuntu-latest
    if: always()
    needs: [build-extensions, generate-configs, build-iso]
    steps:
      - name: Log completion
        run: |
          echo "Build Complete: Custom Talos OS build finished"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
