name: Build & Push Extensions

# ════════════════════════════════════════════════════════════════════════════
# Builds all three ITL Talos extension OCI images and pushes them to GHCR.
#
# Triggers:
#   • push to main/develop that touches extensions/** or this workflow file
#   • any tag push (v*)
#   • manual dispatch (workflow_dispatch) — with optional version override
#   • called as a reusable workflow by ITL.Talos.Flavors or other consumers
#
# Outputs (when called as reusable workflow):
#   image_tag      — the pushed image tag (e.g. v1.0.0 or latest)
#   talos_version  — the resolved Talos version used
# ════════════════════════════════════════════════════════════════════════════

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'extensions/**'
      - '.github/workflows/build-extensions.yaml'
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      talos_version:
        description: 'Talos version (e.g. v1.9.0)'
        required: false
        default: ''
      image_tag:
        description: 'Override image tag (default: branch name or git tag)'
        required: false
        default: ''

  # Reusable workflow — callable from ITL.Talos.Flavors and other consumers
  workflow_call:
    inputs:
      talos_version:
        description: 'Talos version override'
        required: false
        type: string
        default: ''
      image_tag:
        description: 'Override image tag'
        required: false
        type: string
        default: ''
    outputs:
      image_tag:
        description: 'The image tag that was pushed'
        value: ${{ jobs.build-extensions.outputs.image_tag }}
      talos_version:
        description: 'The resolved Talos version'
        value: ${{ jobs.build-extensions.outputs.talos_version }}
      installer_image:
        description: 'Pre-baked installer OCI image (all ITL extensions merged into Talos base)'
        value: ${{ jobs.build-extensions.outputs.installer_image }}

env:
  REGISTRY: ghcr.io
  IMAGE_ORG: itlusions
  TALOS_VERSION: v1.9.0
  GVISOR_TAG: 20260427.0
  INTEL_UCODE_TAG: 20260227

jobs:
  build-extensions:
    name: Build & Push Extensions
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag:       ${{ steps.resolve.outputs.image_tag }}
      talos_version:   ${{ steps.resolve.outputs.talos_version }}
      installer_image: ${{ steps.build-installer.outputs.installer_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Resolve tag and version ─────────────────────────────────────────────
      - name: Resolve image tag and Talos version
        id: resolve
        run: |
          # Talos version: input → env default
          TALOS_VER="${{ inputs.talos_version }}"
          [[ -z "$TALOS_VER" ]] && TALOS_VER="${{ env.TALOS_VERSION }}"
          echo "talos_version=$TALOS_VER" >> "$GITHUB_OUTPUT"

          # Image tag: input → git tag → branch name → 'latest'
          IMG_TAG="${{ inputs.image_tag }}"
          if [[ -z "$IMG_TAG" ]]; then
            REF="${{ github.ref_name }}"
            if [[ "$REF" == v* ]]; then
              IMG_TAG="$REF"
            elif [[ -n "$REF" && "$REF" != "HEAD" ]]; then
              IMG_TAG="${REF//\//-}"   # replace / with - for branch names
            else
              IMG_TAG="latest"
            fi
          fi
          echo "image_tag=$IMG_TAG" >> "$GITHUB_OUTPUT"
          echo "[OK] Talos: $TALOS_VER  Image tag: $IMG_TAG"

      # ── itl-branding ────────────────────────────────────────────────────────
      - name: Build and push itl-talos-hardened-os-branding
        uses: docker/build-push-action@v5
        with:
          context: extensions/itl-branding
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-branding:${{ steps.resolve.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-branding:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── itl-security ────────────────────────────────────────────────────────
      - name: Build and push itl-talos-hardened-os-security
        uses: docker/build-push-action@v5
        with:
          context: extensions/itl-security
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-security:${{ steps.resolve.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-security:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── itl-tpm-register ────────────────────────────────────────────────────
      - name: Build and push itl-talos-tpm-register
        uses: docker/build-push-action@v5
        with:
          context: extensions/itl-tpm-register
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-tpm-register:${{ steps.resolve.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-tpm-register:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.resolve.outputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Installer image ──────────────────────────────────────────────────────
      # Builds a single OCI installer image with all ITL extensions pre-merged.
      # Consumers (ITL.Talos.Flavors) reference this via --base-installer-image
      # so they never need to enumerate individual extension refs at ISO build time.
      - name: Build and push installer image
        id: build-installer
        run: |
          TALOS_VER="${{ steps.resolve.outputs.talos_version }}"
          IMG_TAG="${{ steps.resolve.outputs.image_tag }}"
          INSTALLER_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-installer:${IMG_TAG}"
          mkdir -p /tmp/installer-out

          docker run --rm \
            --privileged \
            -v /dev:/dev \
            -v /tmp/installer-out:/out \
            -v "$HOME/.docker/config.json:/run/containers/auth.json:ro" \
            -e "REGISTRY_AUTH_FILE=/run/containers/auth.json" \
            ghcr.io/siderolabs/imager:${TALOS_VER} \
            installer \
            --arch amd64 \
            --system-extension-image ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-branding:${IMG_TAG} \
            --system-extension-image ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-security:${IMG_TAG} \
            --system-extension-image ${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-tpm-register:${IMG_TAG} \
            --system-extension-image ghcr.io/siderolabs/gvisor:${{ env.GVISOR_TAG }} \
            --system-extension-image ghcr.io/siderolabs/intel-ucode:${{ env.INTEL_UCODE_TAG }}

          # Install crane to push the OCI tarball to GHCR
          CRANE_VER=$(curl -sL https://api.github.com/repos/google/go-containerregistry/releases/latest \
            | grep '"tag_name"' | sed 's/.*"\(v[^"]*\)".*/\1/')
          curl -sL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VER}/go-containerregistry_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin crane

          crane auth login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
          crane push /tmp/installer-out/installer-amd64.tar "${INSTALLER_IMAGE}"
          crane tag "${INSTALLER_IMAGE}" latest

          echo "installer_image=${INSTALLER_IMAGE}" >> "$GITHUB_OUTPUT"
          echo "[OK] Installer image: ${INSTALLER_IMAGE}"

      # ── Summary ─────────────────────────────────────────────────────────────
      - name: Summary
        run: |
          echo "## Extensions Published" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | Tag |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-branding\` | \`${{ steps.resolve.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-hardened-os-security\` | \`${{ steps.resolve.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-tpm-register\` | \`${{ steps.resolve.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| \`${{ env.REGISTRY }}/${{ env.IMAGE_ORG }}/itl-talos-installer\` | \`${{ steps.resolve.outputs.image_tag }}\` |" >> "$GITHUB_STEP_SUMMARY"
