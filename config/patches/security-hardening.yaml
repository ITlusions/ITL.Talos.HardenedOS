# Talos Configuration Patch: Security Hardening
# Applies security hardening, TPM 2.0, LUKS2, audit logging, and other security controls
# Compatible with Talos v1.9 MachineConfig API

machine:
  # ── Kernel modules for TPM and integrity measurement ───────────────
  kernel:
    modules:
      - name: tpm
      - name: tpm_crb
      - name: tpm_tis
      - name: integrity
      - name: dm_crypt

  # ── Kubelet hardening (CIS Kubernetes Benchmark) ───────────────────
  kubelet:
    extraArgs:
      read-only-port: "0"
      protect-kernel-defaults: "true"
      event-record-qps: "5"
      feature-gates: "RotateKubeletServerCertificate=true"
    extraConfig:
      eventRecordQPS: 5
      protectKernelDefaults: true
      rotateCertificates: true
      serverTLSBootstrap: true

  # ── System disk encryption: STATE and EPHEMERAL partitions ─────────
  # Uses LUKS2 with TPM2 PCR sealing for automatic unlock
  systemDiskEncryption:
    state:
      provider: luks2
      keys:
        - nodeID: {}
          slot: 0
        - tpm: {}
          slot: 1
    ephemeral:
      provider: luks2
      keys:
        - nodeID: {}
          slot: 0
        - tpm: {}
          slot: 1

  # ── Kernel sysctls (supplement the itl-security extension) ─────────
  sysctls:
    kernel.kptr_restrict: "2"
    kernel.dmesg_restrict: "1"
    kernel.printk: "3 3 3 3"
    kernel.unprivileged_bpf_disabled: "1"
    kernel.yama.ptrace_scope: "2"
    fs.protected_hardlinks: "1"
    fs.protected_symlinks: "1"
    net.ipv4.conf.all.rp_filter: "1"
    net.ipv4.conf.default.rp_filter: "1"
    net.ipv4.icmp_echo_ignore_broadcasts: "1"
    net.ipv4.icmp_ignore_bogus_error_responses: "1"
    net.ipv4.tcp_syncookies: "1"
    net.ipv4.tcp_rfc1337: "1"
    net.ipv4.conf.all.log_martians: "1"
    net.ipv4.conf.all.accept_redirects: "0"
    net.ipv4.conf.all.send_redirects: "0"
    net.ipv6.conf.all.accept_ra: "0"
    net.ipv4.conf.default.log_martians: "1"
    net.ipv6.conf.all.disable_ipv6: "1"
    net.ipv6.conf.default.disable_ipv6: "1"
    
    # File system hardening
    fs.protected_hardlinks: "1"
    fs.protected_symlinks: "1"
    fs.protected_regular: "2"
    fs.protected_fifos: "2"
    fs.suid_dumpable: "0"
    fs.file-max: "2097152"

  # SSH hardening (if using Talos SSH)
  ssh:
    enabled: true
    # Only allow key-based authentication
    passwordAuthentication: false
    # Strong ciphers and algorithms
    ciphers:
      - chacha20-poly1305@openssh.com
      - aes256-gcm@openssh.com
    hostKeyAlgorithms:
      - ssh-ed25519
    keyExchangeAlgorithms:
      - curve25519-sha256
    macs:
      - umac-128-etm@openssh.com

  # Enable containerd security options
  registries:
    config:
      ghcr.io:
        # Additional TLS verification
        tls:
          insecureSkipVerify: false
      docker.io:
        tls:
          insecureSkipVerify: false

# Control plane configuration for security
controlPlane:
  # API server audit logging
  apiServer:
    extraArgs:
      audit-log-path: /var/log/audit/audit.log
      audit-log-maxage: "30"
      audit-log-maxbackup: "10"
      audit-log-maxsize: "100"
      # Encryption at rest
      encryption-provider-config: /etc/kubernetes/encryption-config.yaml
      # Network policy support
      admission-control-config-file: /etc/kubernetes/admission-control.yaml

  # Controller manager security
  controllerManager:
    extraArgs:
      terminated-pod-gc-threshold: "50"
      feature-gates: "RotateKubeletServerCertificate=true"

  # Scheduler security
  scheduler:
    extraArgs:
      profiling: "false"
      feature-gates: "RotateKubeletServerCertificate=true"

  # Etcd encryption
  etcd:
    extraArgs:
      auto-compaction-mode: "revision"
      auto-compaction-retention: "100"
      cipher-suites: "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"

# Pod security standards enforcement
cluster:
  # Pod security policy
  podSecurityPolicy:
    enforcedPolicyName: "restricted"
  
  # Network policies for segmentation
  networkPolicy:
    enabled: true
