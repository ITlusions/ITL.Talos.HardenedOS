# Bootstrap Manifest: Nginx Ingress Controller for ControlPlane Stack
#
# Deploys Nginx Ingress into the itl-ingress namespace.
# Exposes routes for:
#   api.<partner.domain>       → api-gateway          :8080
#   iam.<partner.domain>       → keycloak             :8080
#   <partner.domain>           → portal               :8090
#   dashboard.<partner.domain> → dashboard            :8090
#   admin.<partner.domain>     → admin                :8090
#
# After deploying the Helm chart, the Ingress objects are created
# automatically.  This manifest only provisions the controller itself.
#
# Source: https://github.com/kubernetes/ingress-nginx
# To pin to a specific version, replace "deploy" path with a tagged URL.
---
# Fetch and apply the official Nginx Ingress release manifest.
# NOTE: This is referenced via cluster.extraManifests in cp-networking.yaml.
# The file is kept here for offline / air-gapped installs:
#   kubectl apply -f flavors/controlplane-stack/manifests/03-ingress-nginx.yaml
#
# For online clusters the URL below is used by Talos directly:
#   https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.10.1/deploy/static/provider/baremetal/deploy.yaml
#
# Patch applied on top: set the ingress class to "nginx" and restrict
# the controller to the itl-ingress namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: itl-ingress-config
  namespace: itl-ingress
  labels:
    itl.io/flavor: controlplane-stack
data:
  # Security hardening for Nginx ingress
  use-forwarded-headers: "true"
  compute-full-forwarded-for: "true"
  use-proxy-protocol: "false"
  # TLS hardening
  ssl-protocols: "TLSv1.2 TLSv1.3"
  ssl-ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"
  # Headers
  add-headers: "itl-ingress/itl-security-headers"
---
# Security response headers injected by Nginx for all ITL routes
apiVersion: v1
kind: ConfigMap
metadata:
  name: itl-security-headers
  namespace: itl-ingress
  labels:
    itl.io/flavor: controlplane-stack
data:
  X-Frame-Options: "DENY"
  X-Content-Type-Options: "nosniff"
  X-XSS-Protection: "1; mode=block"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "camera=(), microphone=(), geolocation=()"
  Content-Security-Policy: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'"
  Strict-Transport-Security: "max-age=31536000; includeSubDomains"
