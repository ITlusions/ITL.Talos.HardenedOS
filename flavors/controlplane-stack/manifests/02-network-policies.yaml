# Bootstrap Manifest: NetworkPolicies for ControlPlane Stack
#
# Default-deny posture: all ingress/egress traffic is blocked unless
# explicitly allowed by a subsequent policy.
#
# Policy map:
#   itl-controlplane ns:
#     - default deny (ingress + egress)
#     - allow: intra-namespace communication
#     - allow: egress to kube-dns (CoreDNS)
#     - allow: egress to Keycloak IAM (port 8080/8443)
#     - allow: ingress from itl-ingress namespace (Nginx controller)
#     - allow: egress to external HTTPS (extension/image pulls, Keycloak ext)
#
# Add more specific allow policies after deploying the stack with:
#   kubectl apply -f flavors/controlplane-stack/manifests/

# ── Default deny: itl-controlplane ──────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: itl-controlplane
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# ── Allow intra-namespace traffic ────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: itl-controlplane
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}

# ── Allow egress to CoreDNS ───────────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-coredns
  namespace: itl-controlplane
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

# ── Allow ingress from Nginx ingress controller ──────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-from-nginx
  namespace: itl-controlplane
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: itl-ingress

# ── Allow egress to external HTTPS (Keycloak, image registries) ──────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-external-https
  namespace: itl-controlplane
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 443
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP

# ── Default deny: itl-monitoring ─────────────────────────────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: itl-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

# ── Allow monitoring namespace to scrape itl-controlplane ────────────────────
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-scrape-controlplane
  namespace: itl-controlplane
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: itl-monitoring
      ports:
        - port: 9090
          protocol: TCP
        - port: 8080
          protocol: TCP
