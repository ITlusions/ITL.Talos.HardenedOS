# Bootstrap Manifest: Namespaces for ControlPlane Stack
# Applied by Talos via cluster.inlineManifests during first boot.
---
apiVersion: v1
kind: Namespace
metadata:
  name: itl-controlplane
  labels:
    itl.io/managed-by: talos-flavor
    itl.io/flavor: controlplane-stack
    # Pod Security Standards: enforce restricted profile for workload ns
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: itl-monitoring
  labels:
    itl.io/managed-by: talos-flavor
    itl.io/flavor: controlplane-stack
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: Namespace
metadata:
  name: itl-ingress
  labels:
    itl.io/managed-by: talos-flavor
    itl.io/flavor: controlplane-stack
    # Ingress controllers need host-port access — use baseline profile
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
