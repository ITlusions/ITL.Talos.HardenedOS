# Talos Flavor Patch: Networking for ControlPlane Stack
#
# Sets explicit pod/service CIDRs that do not clash with the host
# network used by the ITL stack services.  Enables Cilium CNI so
# that Kubernetes NetworkPolicy is enforced (required by the
# default-deny policies bootstrapped by this flavor).
#
# CIDR plan:
#   Nodes         10.10.0.0/24    (physical / VM network)
#   Pods          10.244.0.0/16
#   Services      10.96.0.0/12
#   Ingress VIP   10.10.0.200     (MetalLB address pool — adjust to fit)

machine:
  network:
    nameservers:
      - 1.1.1.1
      - 8.8.8.8
  time:
    disabled: false
    servers:
      - time.cloudflare.com

cluster:
  network:
    podSubnets:
      - 10.244.0.0/16
    serviceSubnets:
      - 10.96.0.0/12
    dnsDomain: cluster.itlusions.local
    # Use Cilium for NetworkPolicy support.
    # Talos will skip the default Flannel install when cni.name = "none";
    # Cilium is bootstrapped via the extraManifests below.
    cni:
      name: none

  # ── Cilium CNI (Kubernetes NetworkPolicy + eBPF dataplane) ──────────
  # Pinned to a known-good version; update in lock-step with Talos releases.
  extraManifests:
    - https://raw.githubusercontent.com/cilium/cilium/v1.15.6/install/kubernetes/quick-install.yaml

  # ── MetalLB for bare-metal LoadBalancer services ──────────────────────
  # Provides an external IP for the Nginx ingress controller.
  # After bootstrap, apply the IPAddressPool + L2Advertisement manually
  # (or via the helm-values-overlay.yaml automation).
  # - https://raw.githubusercontent.com/metallb/metallb/v0.14.5/config/manifests/metallb-native.yaml

  proxy:
    disabled: false
    mode: iptables
    extraArgs:
      metrics-bind-address: "127.0.0.1:10249"

  etcd:
    extraArgs:
      listen-metrics-urls: "http://127.0.0.1:2381"
      auto-compaction-retention: "8"
