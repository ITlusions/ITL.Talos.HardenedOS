# Talos Flavor Patch: Persistent Storage for ControlPlane Stack
#
# Prepares each node to serve persistent volumes via the Rancher
# local-path-provisioner (deployed via cluster.extraManifests below).
#
# Storage layout per node:
#   /var/local-path-provisioner  — provisioner working directory (all PVCs)
#   /var/lib/neo4j               — dedicated mount for Neo4j (I/O intensive)
#
# Kernel modules required by the storage stack:
#   iscsi_tcp  — iSCSI initiator (used by Longhorn if migrating later)
#   dm_thin_pool, dm_snapshot — device mapper for volume snapshots

machine:
  kernel:
    modules:
      - name: iscsi_tcp
      - name: dm_thin_pool
      - name: dm_snapshot

  kubelet:
    # Mount points that kubelet must be able to see inside its namespace.
    # Talos mounts these bind-mounts so PVs survive kubelet restarts.
    extraMounts:
      - destination: /var/local-path-provisioner
        type: bind
        source: /var/local-path-provisioner
        options:
          - bind
          - rshared
          - rw
      - destination: /var/lib/neo4j
        type: bind
        source: /var/lib/neo4j
        options:
          - bind
          - rshared
          - rw

cluster:
  # Install local-path-provisioner as the default StorageClass.
  # All PVCs without an explicit storageClassName will land here.
  extraManifests:
    - https://raw.githubusercontent.com/rancher/local-path-provisioner/v0.0.28/deploy/local-path-storage.yaml
