# Talos Flavor Patch: Kyverno Policy Engine for ControlPlane Stack
#
# Installs Kyverno (admission controller + CRDs) via extraManifests, and
# bakes ITL security policies (generated from ITL.ControlPanel.PolicyBuilder)
# as cluster.inlineManifests so they are applied during bootstrap.
#
# ┌─────────────────────────────────────────────────────────────────────┐
# │ ORDERING                                                            │
# │  extraManifests are applied first (Kyverno install + CRDs).        │
# │  inlineManifests follow — but Kyverno pods need time to start.     │
# │  ClusterPolicy resources will be retried by kubectl until Kyverno  │
# │  is ready. Use failurePolicy: ignore in policies to be safe.       │
# └─────────────────────────────────────────────────────────────────────┘
#
# Regenerate the ClusterPolicy manifests with:
#   python scripts/generate-kyverno-patch.py \
#     --profile security \
#     --output flavors/controlplane-stack/manifests/10-kyverno-policies.yaml
#
# Available profiles: security | network | registry | strict | all

cluster:
  # ── Install Kyverno (admission controller + CRDs) ─────────────────────
  # Pinned to v1.12.x — aligned with Kubernetes v1.29 (Talos v1.9).
  # Update in lock-step with Talos/Kubernetes upgrades.
  extraManifests:
    - https://github.com/kyverno/kyverno/releases/download/v1.12.6/install.yaml

  # ── Kyverno ClusterPolicies (generated by ITL.ControlPanel.PolicyBuilder) ─
  # These are the pre-built security policies. The source YAML is in:
  #   flavors/controlplane-stack/manifests/10-kyverno-policies.yaml
  #
  # To regenerate:
  #   python scripts/generate-kyverno-patch.py --profile security \
  #     --output flavors/controlplane-stack/manifests/10-kyverno-policies.yaml
  #
  # After regenerating, update the contents below to match, OR apply with:
  #   kubectl apply -f flavors/controlplane-stack/manifests/10-kyverno-policies.yaml
  inlineManifests:
    - name: kyverno-policy-pod-security-baseline
      contents: |
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: pod-security-baseline
          labels:
            app.kubernetes.io/name: pod-security-baseline
            itl.io/managed-by: talos-flavor
          annotations:
            description: Enforce Kubernetes Pod Security Standards (baseline). Prevents unprivileged container escalation.
        spec:
          validationFailureAction: audit
          background: true
          failurePolicy: ignore
          rules:
            - name: check-security-context
              match:
                kind: Pod
              validate:
                message: Security context is required
                pattern:
                  spec:
                    securityContext: "?"
            - name: check-non-root
              match:
                kind: Pod
              validate:
                message: Running as root is not allowed
                pattern:
                  spec:
                    securityContext:
                      runAsNonRoot: true

    - name: kyverno-policy-disallow-privileged
      contents: |
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: disallow-privileged
          labels:
            app.kubernetes.io/name: disallow-privileged-containers
            itl.io/managed-by: talos-flavor
          annotations:
            description: Prevent deployment of privileged containers.
        spec:
          validationFailureAction: enforce
          background: true
          failurePolicy: ignore
          rules:
            - name: check-privileged
              match:
                kind: Pod
              validate:
                message: Privileged containers are not allowed
                pattern:
                  spec:
                    containers:
                      - securityContext:
                          privileged: false

    - name: kyverno-policy-disallow-latest-tag
      contents: |
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: disallow-latest-tag
          labels:
            app.kubernetes.io/name: disallow-latest-image-tag
            itl.io/managed-by: talos-flavor
          annotations:
            description: Prevent deployment of images with 'latest' tag.
        spec:
          validationFailureAction: enforce
          background: true
          failurePolicy: ignore
          rules:
            - name: check-image-tag
              match:
                kind: Pod
              validate:
                message: Image tag 'latest' is not allowed, use explicit version
                pattern:
                  spec:
                    containers:
                      - image: "!*:latest"

    - name: kyverno-policy-require-resource-limits
      contents: |
        apiVersion: kyverno.io/v1
        kind: ClusterPolicy
        metadata:
          name: require-resource-limits
          labels:
            app.kubernetes.io/name: require-resource-limits
            itl.io/managed-by: talos-flavor
          annotations:
            description: Ensure all containers specify resource requests and limits.
        spec:
          validationFailureAction: enforce
          background: true
          failurePolicy: ignore
          rules:
            - name: check-resource-limits
              match:
                kind: Pod
              validate:
                message: CPU and memory resources must be specified
                pattern:
                  spec:
                    containers:
                      - resources:
                          requests:
                            cpu: "?"
                            memory: "?"
                          limits:
                            cpu: "?"
                            memory: "?"
