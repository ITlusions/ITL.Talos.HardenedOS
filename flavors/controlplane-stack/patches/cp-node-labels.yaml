# Talos Flavor Patch: Node Labels & Kubelet Tuning for ControlPlane Stack
#
# Adds well-known node labels so the Helm chart can use nodeSelector /
# nodeAffinity to pin workloads to the right nodes:
#
#   itl.io/flavor=controlplane-stack   — marks every node in this cluster
#   itl.io/role=infra                  — nodes that run stateful services
#                                        (postgres, neo4j, redis, rabbitmq)
#   itl.io/role=app                    — nodes that run stateless services
#                                        (api-gateway, providers, portals)
#
# Apply the controlplane (talosctl) patches per node type:
#   controlplane nodes → this file (no role label, they run etcd/apiserver)
#   worker-infra nodes → add patch: `machine.nodeLabels.itl.io/role: infra`
#   worker-app nodes   → add patch: `machine.nodeLabels.itl.io/role: app`
#
# For a single-node dev cluster, omit role labels entirely.

machine:
  nodeLabels:
    itl.io/flavor: controlplane-stack
    itl.io/managed-by: talos

  kubelet:
    # Increase image garbage-collection thresholds — the ITL stack pulls
    # several large images (Keycloak, Neo4j, Postgres).
    extraArgs:
      image-gc-high-threshold: "85"
      image-gc-low-threshold: "80"
      # Reserve resources for OS + Talos system daemons
      system-reserved: "cpu=200m,memory=512Mi,ephemeral-storage=2Gi"
      kube-reserved: "cpu=200m,memory=256Mi"
      eviction-hard: "memory.available<256Mi,nodefs.available<5%"
