# ════════════════════════════════════════════════════════════════════════════
#  ITL ControlPlane Stack — Helm Values Overlay for Talos Flavor
#
#  Usage:
#    helm upgrade --install itl-controlplane ./helm \
#      -f helm/values.yaml \
#      -f flavors/controlplane-stack/helm-values-overlay.yaml \
#      --namespace itl-controlplane \
#      --create-namespace
#
#  This file overrides the defaults in helm/values.yaml with settings
#  appropriate for the Talos-based ControlPlane Stack flavor:
#    - StorageClass  → local-path (provisioned by the flavor)
#    - Ingress       → nginx (provisioned by the flavor)
#    - Node affinity → itl.io/role labels set by cp-node-labels.yaml
#    - Resource tuning for production-grade Talos nodes
# ════════════════════════════════════════════════════════════════════════════

# ── Global ────────────────────────────────────────────────────────────────────
global:
  # Use local-path StorageClass deployed by cp-storage.yaml
  storageClass: local-path

  imagePullSecrets:
    - name: ghcr-pull-secret    # Create this before installing:
                                 # kubectl create secret docker-registry ghcr-pull-secret \
                                 #   --docker-server=ghcr.io \
                                 #   --docker-username=<github-user> \
                                 #   --docker-password=<PAT> \
                                 #   -n itl-controlplane

# ── API Gateway ───────────────────────────────────────────────────────────────
apiGateway:
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 768Mi }
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # host defaults to api.<partner.domain>

# ── Core Provider ─────────────────────────────────────────────────────────────
coreProvider:
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 768Mi }
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app

# ── Identity Provider ─────────────────────────────────────────────────────────
identityProvider:
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 768Mi }
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app

# ── IAM Provider ──────────────────────────────────────────────────────────────
iamProvider:
  replicaCount: 2
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits:   { cpu: 1,    memory: 768Mi }
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app

# ── Portal / Dashboard / Admin ────────────────────────────────────────────────
portal:
  replicaCount: 2
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"

dashboard:
  replicaCount: 2
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app
  ingress:
    enabled: true
    className: nginx

admin:
  replicaCount: 1
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app
  ingress:
    enabled: true
    className: nginx

# ── PostgreSQL ────────────────────────────────────────────────────────────────
postgresql:
  primary:
    nodeSelector:
      itl.io/flavor: controlplane-stack
      itl.io/role: infra
    persistence:
      enabled: true
      storageClass: local-path
      size: 20Gi
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits:   { cpu: 2,    memory: 2Gi   }

# ── Neo4j ─────────────────────────────────────────────────────────────────────
neo4j:
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: infra
  volumes:
    data:
      mode: defaultStorageClass
      requests:
        storage: 20Gi
  resources:
    requests: { cpu: 500m, memory: 1Gi  }
    limits:   { cpu: 2,    memory: 2Gi  }

# ── Redis ─────────────────────────────────────────────────────────────────────
redis:
  master:
    nodeSelector:
      itl.io/flavor: controlplane-stack
      itl.io/role: infra
    persistence:
      enabled: true
      storageClass: local-path
      size: 4Gi
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits:   { cpu: 500m, memory: 512Mi }

# ── RabbitMQ ──────────────────────────────────────────────────────────────────
rabbitmq:
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: infra
  persistence:
    enabled: true
    storageClass: local-path
    size: 8Gi
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits:   { cpu: 1,    memory: 1Gi   }

# ── Keycloak ──────────────────────────────────────────────────────────────────
keycloak:
  nodeSelector:
    itl.io/flavor: controlplane-stack
    itl.io/role: app
  resources:
    requests: { cpu: 500m, memory: 768Mi }
    limits:   { cpu: 2,    memory: 2Gi   }
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/proxy-buffer-size: "128k"
    # hostname defaults to iam.<partner.domain>

# ── Ingress (global) ──────────────────────────────────────────────────────────
ingress:
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
