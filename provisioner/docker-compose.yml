version: "3.9"

# ═══════════════════════════════════════════════════════════════════════════════
# ITL Talos Provisioning Stack
# ═══════════════════════════════════════════════════════════════════════════════
# Services:
#   registration  — FastAPI machine registration + config delivery service
#   caddy         — TLS reverse proxy (terminates HTTPS, proxies to registration)
#
# Volumes:
#   reg-data      — SQLite DB + cached Talos configs (persistent)
#   caddy-data    — Let's Encrypt certs (persistent)
#
# Usage:
#   # 1. Copy .env.example to .env and fill in your values
#   cp .env.example .env
#
#   # 2. Ensure TALOS_RELEASE_TAG is set to the matching GitHub Release tag
#   #    The registration service will download configs from that release
#
#   # 3. Start the stack
#   docker compose up -d
#
#   # 4. On first start, download the Talos role configs:
#   docker compose exec registration /bin/sh -c \
#     "/app/scripts/download-configs.sh ${TALOS_RELEASE_TAG}"
# ═══════════════════════════════════════════════════════════════════════════════

services:

  # ── Registration Service ────────────────────────────────────────────────────
  registration:
    build:
      context: ../services/machine-registration
      dockerfile: Dockerfile
    container_name: itl-machine-registration
    restart: unless-stopped

    environment:
      ITL_DB_URL:          "sqlite:////var/lib/itl-reg/db/machines.db"
      ITL_CONFIG_CACHE_DIR: "/var/lib/itl-reg/configs"
      ITL_SERVICE_URL:      "${ITL_SERVICE_URL:-https://reg.itlusions.com}"
      ITL_ISO_BASE_URL:     "${ITL_ISO_BASE_URL:-https://github.com/ITlusions/ITL.Talos.HardenedOS/releases/latest/download}"
      ITL_ADMIN_TOKEN:      "${ITL_ADMIN_TOKEN:?Set ITL_ADMIN_TOKEN in .env}"

    volumes:
      - reg-data:/var/lib/itl-reg
      - ./scripts:/app/scripts:ro

    networks:
      - internal

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

    expose:
      - "8080"

  # ── Caddy TLS Reverse Proxy ─────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: itl-reg-caddy
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

    networks:
      - internal

    depends_on:
      registration:
        condition: service_healthy

volumes:
  reg-data:
    driver: local
  caddy-data:
    driver: local
  caddy-config:
    driver: local

networks:
  internal:
    driver: bridge
